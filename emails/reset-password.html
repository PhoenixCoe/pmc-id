<!-- Reset password. Paste this whole file into the Message body box. -->
<style>
@font-face{font-family:'PMC Header';src:url('https://id.pmcstudios.uk/fonts/PMCHeader.woff2') format('woff2');font-weight:400;font-style:normal}
@font-face{font-family:'PMC Font';src:url('https://id.pmcstudios.uk/fonts/PMCFont.woff2') format('woff2');font-weight:400;font-style:normal}
</style>
<div style="margin:0;padding:24px 12px;background:#FBF6EC;color:#171717">
  <div style="max-width:488px;margin:0 auto;padding:0 8px 8px 0;background:#6E2A15">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:4px solid #171717;background:#FBF6EC">
      <tr><td bgcolor="#171717" style="background:#171717;line-height:0"><img src="https://id.pmcstudios.uk/img/email-header.png" width="472" height="88" alt="PMC ID" style="display:block;width:100%;height:auto;border:0;color:#FBF6EC;font-family:'PMC Header','Arial Narrow',Arial,sans-serif;font-size:28px;line-height:88px"></td></tr>
      <tr><td bgcolor="#B94A2C" style="background:#B94A2C;padding:22px 22px 20px;border-top:4px solid #171717;border-bottom:4px solid #171717">
        <span style="display:inline-block;margin:0 0 12px;padding:4px 9px 2px;background:#FBF6EC;color:#B94A2C;border:3px solid #171717;font-family:'PMC Header','Arial Narrow',Arial,sans-serif;font-size:15px;line-height:1.1;letter-spacing:1px;text-transform:uppercase">Password</span>
        <p style="margin:0;font-family:'PMC Header','Arial Narrow',Arial,sans-serif;font-size:40px;font-weight:normal;line-height:.95;text-transform:uppercase;color:#FBF6EC">Reset your password</p>
      </td></tr>
      <tr><td style="padding:22px 22px 8px;font-family:'PMC Font','Courier New',monospace;font-size:16px;line-height:1.55;color:#171717">Type this code on the PMC ID page, then choose a new password.</td></tr>
      <tr><td style="padding:10px 22px 26px">
        <div style="display:inline-block;padding:0 8px 8px 0;background:#6E2A15">
          <div style="padding:10px 18px 6px;border:4px solid #171717;background:#B49A57;font-family:'PMC Header','Arial Narrow',Arial,sans-serif;font-size:50px;line-height:1.1;letter-spacing:8px;color:#171717">{{ .Token }}</div>
        </div>
      </td></tr>
      <tr><td bgcolor="#171717" style="background:#171717;padding:14px 22px 12px;font-family:'PMC Font','Courier New',monospace;font-size:13px;line-height:1.5;color:#FBF6EC">If you did not ask for this, ignore this email. Your password has not changed.</td></tr>
    </table>
  </div>
</div>
