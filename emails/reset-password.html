<!-- Reset password. Paste this whole file into the Message body box. -->
<div style="margin:0;padding:24px 12px;background:#FBF6EC;font-family:Arial,Helvetica,sans-serif;color:#171717">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;border:4px solid #171717;background:#FBF6EC">
    <tr><td style="padding:14px 22px;background:#171717;color:#FBF6EC;font-size:26px;font-weight:bold;letter-spacing:1px">PMC ID</td></tr>
    <tr><td style="padding:26px 22px 8px">
      <p style="margin:0 0 10px;font-size:26px;font-weight:bold;line-height:1.15">Reset your password</p>
      <p style="margin:0;font-size:16px;line-height:1.5">Type this code on the PMC ID page, then choose a new password.</p>
    </td></tr>
    <tr><td style="padding:14px 22px 22px">
      <div style="display:inline-block;padding:12px 18px;border:4px solid #171717;background:#E3EFE7;font-family:'Courier New',monospace;font-size:34px;font-weight:bold;letter-spacing:8px">{{ .Token }}</div>
    </td></tr>
    <tr><td style="padding:0 22px 24px;font-size:13px;line-height:1.5;color:#1A4934">If you did not ask for this, ignore this email. Your password has not changed.</td></tr>
  </table>
</div>
