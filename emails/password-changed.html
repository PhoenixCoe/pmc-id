<!-- Password changed. Paste this whole file into the Message body box of the "Password changed" security notification. -->
<style>

<div style="margin:0;padding:24px 12px;background:#FBF6EC;color:#171717">
  <div style="max-width:488px;margin:0 auto;padding:0 8px 8px 0;background:#3F2D66">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:4px solid #171717;background:#FBF6EC">
      <tr><td bgcolor="#171717" style="background:#171717;line-height:0"><img src="https://id.pmcstudios.uk/img/email-header.png" width="472" height="88" alt="PMC ID" style="display:block;width:100%;height:auto;border:0;color:#FBF6EC;font-family:'PMC Header','Arial Narrow',Arial,sans-serif;font-size:28px;line-height:88px"></td></tr>
      <tr><td bgcolor="#6B4FA0" style="background:#6B4FA0;padding:22px 22px 20px;border-top:4px solid #171717;border-bottom:4px solid #171717">

      <tr><td style="padding:22px 22px 8px;font-family:'PMC Font','Courier New',monospace;font-size:16px;line-height:1.55;color:#171717">The password for your PMC ID was just changed. If that was you, you do not need to do anything.</td></tr>

      </td></tr>
      <tr><td bgcolor="#171717" style="background:#171717;padding:14px 22px 12px;font-family:'PMC Font','Courier New',monospace;font-size:13px;line-height:1.5;color:#FBF6EC">PMC ID will never ask for your password by email.</td></tr>
